name: Server image

# Builds the Drop server image for linux/amd64 and linux/arm64 and pushes it to
# ghcr.io/kmank10/drop. Runs on v* tag pushes, or by hand for an existing tag.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      ref:
        description: "Existing release tag to build, e.g. v1.0.0"
        required: true
        type: string

permissions:
  contents: read
  packages: write

concurrency:
  group: server-image-${{ inputs.ref || github.ref_name }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/kmank10/drop
  REF: ${{ inputs.ref || github.ref_name }}

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - name: Check the ref is a version tag
        run: |
          if ! printf '%s' "$REF" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then
            echo "::error::$REF is not a version tag like v1.2.3"
            exit 1
          fi

      - uses: actions/checkout@v6
        with:
          ref: refs/tags/${{ env.REF }}
          persist-credentials: false

      - name: Commit being built
        id: src
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v6
        env:
          DOCKER_METADATA_ANNOTATIONS_LEVELS: manifest,index
        with:
          images: ${{ env.IMAGE }}
          flavor: latest=false
          tags: |
            type=semver,pattern={{version}},value=${{ env.REF }}
            type=semver,pattern={{major}}.{{minor}},value=${{ env.REF }}
            type=semver,pattern={{major}},value=${{ env.REF }},enable=${{ !startsWith(env.REF, 'v0.') }}
            type=raw,value=latest,enable=${{ !contains(env.REF, '-') }}
          labels: |
            org.opencontainers.image.title=Drop
            org.opencontainers.image.description=Self-hosted encrypted clipboard server
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.url=https://github.com/${{ github.repository }}
            org.opencontainers.image.licenses=MIT
            org.opencontainers.image.revision=${{ steps.src.outputs.sha }}
          annotations: |
            org.opencontainers.image.title=Drop
            org.opencontainers.image.description=Self-hosted encrypted clipboard server
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.licenses=MIT
            org.opencontainers.image.revision=${{ steps.src.outputs.sha }}

      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Show the pushed manifest
        run: docker buildx imagetools inspect "${IMAGE}:${REF#v}"
