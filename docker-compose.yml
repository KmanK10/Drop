# Build Drop from this checkout and run it. Put the values in .env next to
# this file (copy .env.example). Do not commit .env.
services:
  drop:
    build: .
    restart: unless-stopped
    ports:
      - "${DROP_PORT:-8080}:8080"
    environment:
      SETUP_SECRET: ${SETUP_SECRET:?Set SETUP_SECRET in .env}
      PUBLIC_URL: ${PUBLIC_URL:-}
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      TRUST_PROXY: ${TRUST_PROXY:-true}
    volumes:
      - drop-data:/data

volumes:
  drop-data:
